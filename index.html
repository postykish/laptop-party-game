<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>That's Good, That's Bad — Laptop Party</title>
<style>
  :root{
    --teal-deep:#0d1f1a;
    --teal-mid:#173a30;
    --magenta:#e0407a;
    --magenta-bright:#ff5c96;
    --cream:#f2ede4;
    --ink:#0b0b0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--teal-deep);
    font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;
    touch-action:none;
  }
  #app{
    position:relative;
    width:100%; height:100%;
    max-width:520px;
    margin:0 auto;
    background:radial-gradient(120% 90% at 50% 0%, #1c3f34 0%, #0d1f1a 55%, #090f0d 100%);
    overflow:hidden;
  }
  /* grain overlay */
  #grain{
    position:absolute; inset:0; pointer-events:none; z-index:50;
    opacity:.22;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  #glow{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      radial-gradient(38% 22% at 22% 8%, rgba(200,255,230,.18), transparent 60%),
      radial-gradient(45% 30% at 78% 92%, rgba(224,64,122,.16), transparent 60%);
  }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 22px;
    z-index:5;
    text-align:center;
  }
  .hidden{display:none !important;}

  h1.title{
    color:var(--cream);
    font-size:clamp(30px,9vw,46px);
    line-height:0.92;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    text-transform:uppercase;
    text-shadow:0 0 18px rgba(224,64,122,.35);
  }
  h1.title span{color:var(--magenta-bright);}
  .subtitle{
    color:#bcd3c9;
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-weight:400;
    font-size:15px;
    margin-bottom:34px;
    max-width:280px;
    line-height:1.4;
  }

  .avatar-row{
    display:flex; gap:18px; justify-content:center; margin-bottom:26px;
  }
  .avatar-btn{
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .avatar-img{
    width:84px; height:84px; border-radius:50%;
    border:3px solid #0b0b0b;
    background:#ffffff;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .avatar-btn:active .avatar-img{transform:scale(.92);}
  .avatar-btn.selected .avatar-img{
    border-color:var(--magenta-bright);
    box-shadow:0 0 0 4px rgba(255,92,150,.25), 0 0 22px rgba(255,92,150,.5);
    transform:scale(1.06);
  }
  .avatar-name{
    color:var(--cream); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    opacity:.85;
  }

  .btn-primary{
    background:var(--magenta-bright);
    color:#160810;
    border:none;
    font-family:inherit;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:17px;
    padding:16px 38px;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 6px 0 #a12653, 0 10px 24px rgba(224,64,122,.35);
    transition:transform .08s ease;
  }
  .btn-primary:active{transform:translateY(4px); box-shadow:0 2px 0 #a12653, 0 4px 14px rgba(224,64,122,.3);}
  .btn-secondary{
    margin-top:16px;
    background:none;
    border:1.5px solid rgba(242,237,228,.4);
    color:var(--cream);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:11px 26px;
    border-radius:30px;
    cursor:pointer;
  }

  /* HUD */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding:14px 16px 0;
    display:flex; flex-direction:column; gap:8px;
  }
  .hud-top{display:flex; justify-content:space-between; align-items:center;}
  .score-box{
    color:var(--cream); font-size:22px; font-weight:900; letter-spacing:.02em;
    text-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .score-box small{display:block; font-size:9px; font-weight:400; letter-spacing:.12em; opacity:.6; font-family:Georgia,serif; font-style:italic;}
  .timer-box{
    color:var(--cream); font-size:14px; font-variant-numeric:tabular-nums;
    background:rgba(0,0,0,.25); padding:5px 12px; border-radius:20px;
  }
  .mad-label{
    color:var(--magenta-bright); font-size:10px; letter-spacing:.15em; text-transform:uppercase; font-weight:700;
  }
  .mad-track{
    height:10px; border-radius:6px; background:rgba(255,255,255,.12);
    overflow:hidden; border:1px solid rgba(255,255,255,.15);
  }
  .mad-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, #6b1638, var(--magenta-bright));
    transition:width .15s ease;
  }

  #stage{
    position:absolute; inset:0; z-index:10;
  }

  .player{
    position:absolute; bottom:70px; width:76px; height:76px;
    border-radius:50%;
    border:3px solid #0b0b0b;
    box-shadow:0 8px 14px rgba(0,0,0,.4);
    background:#ffffff;
    transform:translateX(-50%);
    z-index:15;
    transition:transform .04s linear;
  }

  .falling{
    position:absolute; z-index:12; will-change:transform;
    width:52px; height:52px;
    background-size:contain;
    background-repeat:no-repeat;
  }
  .falling.good{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><circle cx='100.0' cy='62.0' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='122.3' cy='69.3' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='136.1' cy='88.3' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='136.1' cy='111.7' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='122.3' cy='130.7' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='100.0' cy='138.0' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='77.7' cy='130.7' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='63.9' cy='111.7' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='63.9' cy='88.3' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='77.7' cy='69.3' r='16' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><circle cx='100' cy='100' r='36' fill='%23d4457d' stroke='%231b1018' stroke-width='5'/><text x='100' y='107' text-anchor='middle' font-family='Arial Black, Arial, sans-serif' font-weight='900' font-size='30' fill='%23d7d9d4'>GOOD</text></svg>");
  }
  .falling.bad{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><path d='M 100.0,46.0 L 107.4,77.2 L 131.7,56.3 L 119.4,85.9 L 151.4,83.3 L 124.0,100.0 L 151.4,116.7 L 119.4,114.1 L 131.7,143.7 L 107.4,122.8 L 100.0,154.0 L 92.6,122.8 L 68.3,143.7 L 80.6,114.1 L 48.6,116.7 L 76.0,100.0 L 48.6,83.3 L 80.6,85.9 L 68.3,56.3 L 92.6,77.2 Z' fill='%232e5550' stroke='%231b1018' stroke-width='5' stroke-linejoin='round'/><text x='100' y='107' text-anchor='middle' font-family='Arial Black, Arial, sans-serif' font-weight='900' font-size='32' fill='%23d7d9d4'>BAD</text></svg>");
  }

  #mirrorFlash{
    position:absolute; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    pointer-events:none;
    opacity:0;
    background:rgba(0,0,0,.35);
  }
  #mirrorFlash .mtxt{
    font-size:clamp(30px,10vw,44px);
    font-weight:900; text-transform:uppercase; letter-spacing:-0.01em;
    color:var(--cream);
  }
  #mirrorFlash .mtxt.flip{
    transform:scaleY(-1);
    color:var(--teal-mid);
    -webkit-text-stroke:1px var(--cream);
    margin-top:-6px;
  }

  #tapToStart{
    position:absolute; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    background:rgba(9,15,13,.92);
    color:var(--cream); font-size:14px; letter-spacing:.08em; text-transform:uppercase;
    flex-direction:column; gap:14px;
  }

  .result-card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:22px 26px;
    margin-bottom:22px;
    width:100%; max-width:300px;
  }
  .result-row{display:flex; justify-content:space-between; padding:7px 0; color:var(--cream); font-size:14px; border-bottom:1px dashed rgba(255,255,255,.12);}
  .result-row:last-child{border-bottom:none;}
  .result-row b{color:var(--magenta-bright); font-size:16px;}

  .char-thumb{
    width:64px; height:64px; border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    margin-bottom:10px;
  }
</style>
</head>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  roundSeconds: 28,
  spawnIntervalStart: 850,
  spawnIntervalMin: 380,
  fallDurationStart: 3600,
  fallDurationMin: 1900,
  goodChance: 0.62,
  madPerBad: 22,          // % mad meter per bad caught
  madDecayPerGood: -4,    // slight cool-down on good catch
  presaveUrl: "https://laptopparty.example/presave" // TODO: replace with the real pre-save link
};

/* ============ AUDIO ============ */
// good  -> GOOD.mp3            (caught a good drop)
// bad   -> BAD.mp3              (caught a bad drop)
// grow  -> KIDDING_ME.mp3       (mad meter climbing / overload moment)
// fill  -> FILL.mp3             (end screen)
//
// Plain HTMLAudioElement pools instead of the Web Audio API on purpose:
// AudioContext gets heavily restricted or silently broken inside in-app
// browsers (Instagram, Telegram, TikTok, etc). Native <audio>.play() fired
// directly inside a tap is the most broadly compatible approach there.
const AudioBank = {
  pools: {},
  poolSize: 3,
  register(key, base64){
    const src = 'data:audio/mpeg;base64,' + base64;
    const pool = [];
    for(let i=0;i<this.poolSize;i++){
      const a = new Audio(src);
      a.preload = 'auto';
      a.playsInline = true;
      a.volume = 1;
      pool.push(a);
    }
    this.pools[key] = { pool, idx: 0 };
  },
  registerAll(map){
    for(const key in map){ this.register(key, map[key]); }
  },
  // Must be called synchronously inside a user tap/click handler.
  // Playing (and immediately pausing) each element once inside the gesture
  // unlocks it for later programmatic playback in most mobile webviews.
  unlockAll(){
    Object.values(this.pools).forEach(({pool})=>{
      pool.forEach(a=>{
        try{
          const p = a.play();
          if(p && p.then){
            p.then(()=>{ a.pause(); a.currentTime = 0; }).catch(()=>{});
          } else {
            a.pause(); a.currentTime = 0;
          }

// Register as soon as the script runs (no network fetch involved, just
// building <audio> elements from inline base64), so they're ready to unlock
// the instant the person taps Play.
ensureSamplesRegistered();

$('#playBtn').addEventListener('click', ()=>{
  // Runs synchronously inside the tap so embedded/in-app browsers
  // (Instagram, Telegram, etc) treat playback as user-initiated.
  AudioBank.unlockAll();
  beginRound();
});

function beginRound(){
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  resetState();
  buildPlayer();
  state.running = true;
  runSpawnLoop();
  runTimer();
}

function resetState(){
  state.score=0; state.goodCaught=0; state.madPct=0;
  state.timeLeft = CONFIG.roundSeconds;
  state.objects.forEach(o=>o.el.remove());
  state.objects = [];
  scoreVal.textContent = '0';
  timerVal.textContent = state.timeLeft;
  madFill.style.width = '0%';
  stage.innerHTML = '';
}

/* ============ PLAYER ============ */
function buildPlayer(){
  player = document.createElement('div');
  player.className = 'player';
  const img = document.createElement('img');
  img.src = AVATARS[state.char];
  img.style.width='100%'; img.style.height='100%'; img.style.borderRadius='50%'; img.style.objectFit='cover';
  player.appendChild(img);
  stage.appendChild(player);
  state.playerX = 50;
  positionPlayer();
}
function positionPlayer(){
  player.style.left = state.playerX + '%';
}
function movePlayerTo(clientX){
  const rect = stage.getBoundingClientRect();
  let pct = ((clientX - rect.left) / rect.width) * 100;
  pct = Math.max(8, Math.min(92, pct));
  state.playerX = pct;
  positionPlayer();
}
stage.addEventListener('touchstart', e=>{ movePlayerTo(e.touches[0].clientX); }, {passive:true});
stage.addEventListener('touchmove', e=>{ movePlayerTo(e.touches[0].clientX); }, {passive:true});
stage.addEventListener('mousedown', e=>{ movePlayerTo(e.clientX); });
stage.addEventListener('mousemove', e=>{ if(e.buttons===1) movePlayerTo(e.clientX); });

/* ============ SPAWN / FALL ============ */
function difficultyT(){
  // 0 at start, 1 at end of round
  return 1 - (state.timeLeft / CONFIG.roundSeconds);
}
function currentSpawnInterval(){
  const t = difficultyT();
  return CONFIG.spawnIntervalStart + (CONFIG.spawnIntervalMin - CONFIG.spawnIntervalStart) * t;
}
function currentFallDuration(){
  const t = difficultyT();
  return CONFIG.fallDurationStart + (CONFIG.fallDurationMin - CONFIG.fallDurationStart) * t;
}

function runSpawnLoop(){
  if(!state.running) return;
  spawnObject();
  state.spawnTimer = setTimeout(runSpawnLoop, currentSpawnInterval());
}

function spawnObject(){
  const isGood = Math.random() < CONFIG.goodChance;
  const el = document.createElement('div');
  el.className = 'falling ' + (isGood ? 'good' : 'bad');
  const xPct = 6 + Math.random()*88;
  el.style.left = xPct + '%';
  el.style.top = '-40px';
  stage.appendChild(el);

  const dur = currentFallDuration();
  const obj = { el, xPct, isGood, start: performance.now(), dur, caught:false };
  state.objects.push(obj);

  el.animate(
    [{ transform:'translateY(0)' }, { transform:`translateY(${stage.clientHeight+60}px)` }],
    { duration:dur, easing:'linear', fill:'forwards' }
  );

  setTimeout(()=>{
    if(!obj.caught){ el.remove(); }
    state.objects = state.objects.filter(o=>o!==obj);
  }, dur+50);
}

/* collision check loop */
function collisionLoop(){
  if(state.running && player){
    const playerRect = player.getBoundingClientRect();
    state.objects.forEach(obj=>{
      if(obj.caught) return;
      const r = obj.el.getBoundingClientRect();
      const dx = (r.left + r.width/2) - (playerRect.left + playerRect.width/2);
      const dy = (r.top + r.height/2) - (playerRect.top + playerRect.height/2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < (playerRect.width/2 + r.width/2 - 8)){
        obj.caught = true;
        catchObject(obj);
      }
    });
  }
  requestAnimationFrame(collisionLoop);
}

function catchObject(obj){
  obj.el.remove();
  if(obj.isGood){
    state.score += 10;
    state.goodCaught += 1;
    state.madPct = Math.max(0, state.madPct + CONFIG.madDecayPerGood);
    AudioBank.play('good');
    popFeedback(obj.xPct, true);
  } else {
    state.score = Math.max(0, state.score - 3);
    state.madPct = Math.min(100, state.madPct + CONFIG.madPerBad);
    AudioBank.play('bad');
    popFeedback(obj.xPct, false);
    if(state.madPct >= 100){
      triggerMadOverload();
    } else {
      // the mad meter just grew — layer the "kidding me" cue on top
      setTimeout(()=>AudioBank.play('grow'), 90);
    }
  }
  scoreVal.textContent = state.score;
  madFill.style.width = state.madPct + '%';
}

function popFeedback(xPct, good){
  const p = document.createElement('div');
  p.textContent = good ? '+10' : '−mad';
  p.style.position='absolute';
  p.style.left = xPct+'%';
  p.style.bottom = '150px';
  p.style.color = good ? '#ff8fbc' : '#8fd8c2';
  p.style.fontWeight='900';
  p.style.fontSize='13px';
  p.style.zIndex = 16;
  p.style.pointerEvents='none';
  stage.appendChild(p);
  p.animate([{ transform:'translateY(0)', opacity:1 }, { transform:'translateY(-30px)', opacity:0 }], { duration:600, easing:'ease-out' });
  setTimeout(()=>p.remove(),620);
}

function triggerMadOverload(){
  state.running = false; // stop catches immediately, game is over
  clearTimeout(state.spawnTimer);
  clearInterval(state.tickTimer);
  AudioBank.play('grow');
  madFill.style.width = '100%';
  document.getElementById('app').animate(
    [{transform:'translate(0,0)'},{transform:'translate(-6px,4px)'},{transform:'translate(6px,-4px)'},{transform:'translate(-4px,0)'},{transform:'translate(0,0)'}],
    { duration:260 }
  );
  mirrorFlash.style.opacity = 1;
  mirrorFlash.style.transition = 'none';
  setTimeout(()=>{
    mirrorFlash.style.transition = 'opacity .5s ease';
    mirrorFlash.style.opacity = 0;
  }, 420);
  setTimeout(()=>{ endRound(); }, 700);
}

/* ============ TIMER ============ */
function runTimer(){
  state.tickTimer = setInterval(()=>{
    state.timeLeft -= 1;
    timerVal.textContent = Math.max(0, state.timeLeft);
    if(state.timeLeft <= 0){
      endRound();
    }
  }, 1000);
}

function endRound(){
  state.running = false;
  clearTimeout(state.spawnTimer);
  clearInterval(state.tickTimer);
  state.objects.forEach(o=>o.el.remove());
  state.objects = [];

  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  AudioBank.play('fill');
  $('#endThumb').src = AVATARS[state.char];
  $('#finalScore').textContent = state.score;
  $('#finalMad').textContent = Math.round(state.madPct) + '%';
  $('#finalGood').textContent = state.goodCaught;
}

$('#presaveBtn').addEventListener('click', ()=>{
  window.open(CONFIG.presaveUrl, '_blank');
});
$('#retryBtn').addEventListener('click', ()=>{
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

requestAnimationFrame(collisionLoop);
</script>
</body>
</html>
